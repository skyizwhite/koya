openapi: 3.1.0
info:
  title: koya
  version: 0.19.0
  summary: Delivery and admin APIs of a koya server
  description: |
    Two JSON APIs on one server.

    * The **delivery API** (`/api/v1`) reads published content with a per-space
      **delivery key**, created on the space's *Keys* page. It answers browsers
      on any origin: a preflight `OPTIONS` gets `204` with
      `Access-Control-Allow-Origin: *`, `Access-Control-Allow-Methods: GET`,
      `Access-Control-Allow-Headers: X-KOYA-DELIVERY-KEY` and
      `Access-Control-Max-Age: 86400`, and every answer carries
      `Access-Control-Allow-Origin: *`. The admin API answers no cross-origin
      request.
    * The **admin API** (`/admin/api`) manages the schema, contents, keys and media
      with a **management key** (made on the space's *Keys* page) as a Bearer
      token. A key belongs to one space: every route but `/admin/api/me` names a
      space, and a key sent to another space's route is refused with 403. The
      owner secret and the admin UI's session only log into the admin UI.

    Bodies use camelCase keys. Timestamps are ISO 8601 in UTC with milliseconds
    (`2026-09-20T05:04:03.123Z`). Every error is
    `{"error": {"code", "message", "details"?}}`; any route can also answer
    `500 internal_error`. Any route given a request body over 21 MB answers
    `413 too_large` before reading it. The
    schema document is specified in SCHEMA.md, and API.md walks through both
    APIs. koya-ts-sdk (https://github.com/skyizwhite/koya-ts-sdk) wraps them.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: https://cms.example.com
        description: The server's KOYA_BASE_URL

tags:
  - name: server
    description: The caller and the server itself
  - name: delivery
    description: Published content, read with a delivery key
  - name: schema
    description: The stored schema and the diff against a new one
  - name: lists
    description: List contents including drafts
  - name: objects
    description: Objects including drafts
  - name: keys
    description: Delivery keys and the webhook secret
  - name: media
    description: The image library

security: []

paths:
  /api/v1/{space}/lists/{model}:
    get:
      operationId: getList
      tags: [delivery]
      summary: List published list contents
      description: A page of a `list` model's published contents. 404 for an `object` model.
      security: [{ deliveryKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/orders"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/filters"
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/include"
      responses:
        "200":
          description: A page of list contents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentList" }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/{space}/lists/{model}/{id}:
    get:
      operationId: getListContent
      tags: [delivery]
      summary: Read one published list content
      description: Its draft with the right `draftKey`. 404 for an `object` model.
      security: [{ deliveryKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/include"
        - $ref: "#/components/parameters/draftKey"
      responses:
        "200":
          description: The list content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Content" }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/{space}/lists/{model}/slugs/{slug}:
    get:
      operationId: getListContentBySlug
      tags: [delivery]
      summary: Read one published list content by its slug
      description: |
        The content whose published slug it is, as `getListContent` reads it.
        With the content's `draftKey`, its draft's slug finds it too, and its
        draft is read; a key that is not the content's finds it by its published
        slug only. 404 for an `object` model, a model without a slug field, or a
        slug two contents hold.
      security: [{ deliveryKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/include"
        - $ref: "#/components/parameters/draftKey"
      responses:
        "200":
          description: The list content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Content" }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/{space}/objects/{model}:
    get:
      operationId: getObject
      tags: [delivery]
      summary: Read a published object
      description: |
        The one content of an `object` model, or its draft with the right
        `draftKey`. 404 for a `list` model, or while the object is not published.
      security: [{ deliveryKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/include"
        - $ref: "#/components/parameters/draftKey"
      responses:
        "200":
          description: The object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Content" }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /health:
    get:
      operationId: getHealth
      tags: [server]
      summary: Liveness, touching the database
      responses:
        "200":
          description: The server answers and its database can be read
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        "503":
          description: "`unavailable`: the database cannot be read"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admin/api/me:
    get:
      operationId: getMe
      tags: [server]
      summary: Who am I
      security: [{ managementKey: [] }]
      responses:
        "200":
          description: Confirms the key and reports the server version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/{space}/schema:
    parameters:
      - $ref: "#/components/parameters/space"
    get:
      operationId: getSchema
      tags: [schema]
      summary: The space's stored schema
      security: [{ managementKey: [] }]
      responses:
        "200":
          description: The schema document (see SCHEMA.md); empty `models` before any deploy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schema" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: deploySchema
      tags: [schema]
      summary: Replace the space's schema
      description: |
        Validates the document, diffs it against the space's stored schema and,
        unless a destructive change is present without `force=true`, stores it.
        Existing content changes only as the schema does: a rename carries it
        through, and a removed or retyped field's values are taken out of every
        published object, draft and revision. The space must already exist — it is
        made in the admin UI — and a deploy to another name, one that does not
        exist included, is a 403.
      security: [{ managementKey: [] }]
      parameters:
        - name: force
          in: query
          schema: { type: string, enum: ["true"] }
          description: Apply destructive changes too.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Schema" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployResult" }
        "400": { $ref: "#/components/responses/InvalidSchema" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`destructive_changes`: destructive changes without `force=true`; `contents_do_not_fit`: stored contents do not fit a tightened option or a required field added, with or without `force`. `details` lists every change, with its `misfits`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                error:
                  code: destructive_changes
                  message: Schema deploy contains destructive changes; retry with force=true
                  details:
                    - { op: remove_field, path: blog.summary, destructive: true, description: "! - blog.summary (text)" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /admin/api/{space}/schema/plan:
    parameters:
      - $ref: "#/components/parameters/space"
    post:
      operationId: planSchema
      tags: [schema]
      summary: The changes a PUT of this schema would apply
      security: [{ managementKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Schema" }
      responses:
        "200":
          description: The plan; nothing is stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/InvalidSchema" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /admin/api/{space}/lists/{model}:
    parameters:
      - $ref: "#/components/parameters/space"
      - $ref: "#/components/parameters/model"
    get:
      operationId: getAdminList
      tags: [lists]
      summary: List every list content, drafts included
      description: |
        A page of a `list` model's contents; takes the delivery API's `limit`,
        `offset`, `orders`, `filters` and `q`, and they apply to the draft data
        when a content has one. 404 for an `object` model.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/orders"
        - $ref: "#/components/parameters/filters"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: A page of list contents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentList" }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createAdminListContent
      tags: [lists]
      summary: Create a list content
      description: |
        Saved as a draft unless `publish` is true. `id` and the system timestamps
        may be supplied, for imports that keep another system's ids and dates; an
        id need only be unique within the space;
        a timestamp needs a date, a time and an offset or `Z`, and is stored in
        UTC with milliseconds.
        `publishedAt` and `revisedAt` are only stored when publishing. 404 for an
        `object` model: its object is made by its first write.
      security: [{ managementKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContent" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`: a content with this `id` already exists in the space"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/api/{space}/lists/{model}/{id}:
    description: A list content; every route under it answers 404 for an `object` model.
    parameters:
      - $ref: "#/components/parameters/space"
      - $ref: "#/components/parameters/model"
      - $ref: "#/components/parameters/id"
    get:
      operationId: getAdminListContent
      tags: [lists]
      summary: Read a list content, both versions
      security: [{ managementKey: [] }]
      responses:
        "200":
          description: The content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAdminListContent
      tags: [lists]
      summary: Save a draft
      description: |
        `data` is merged onto the current draft (or, without one, the published
        data): keys present replace, a `null` value removes the key, keys absent
        stay. The result is validated whole. A new draft key is issued, so earlier
        preview links stop working. When the result is what the content holds
        already, nothing is written -- no draft, no revision, no webhook -- and
        the content comes back as it is; when it is the published data again,
        the draft is dropped, as `discard-draft` would.
      security: [{ managementKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDraft" }
      responses:
        "200":
          description: The content with its new draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteAdminListContent
      tags: [lists]
      summary: Delete a list content
      description: |
        Removes both versions. Fires `delete` webhooks, or `discard` for a content
        that was only a draft.
        Refused with 409 `in_use` while another content refers to it.
      security: [{ managementKey: [] }]
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "409":
          description: "`in_use`: other contents refer to it through a reference field of the current schema, one inside a custom field or a repeater's rows included; the message names how many"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/{space}/lists/{model}/slugs/{slug}:
    description: |
      A list content found by its published slug or its draft's. 404 for an
      `object` model, a model without a slug field, or a slug two contents hold.
      Publishing and the rest are done at its id.
    parameters:
      - $ref: "#/components/parameters/space"
      - $ref: "#/components/parameters/model"
      - $ref: "#/components/parameters/slug"
    get:
      operationId: getAdminListContentBySlug
      tags: [lists]
      summary: Read a list content by its slug, both versions
      security: [{ managementKey: [] }]
      responses:
        "200":
          description: The content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAdminListContentBySlug
      tags: [lists]
      summary: Save a draft of a list content found by its slug
      description: As `updateAdminListContent`.
      security: [{ managementKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDraft" }
      responses:
        "200":
          description: The content with its new draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteAdminListContentBySlug
      tags: [lists]
      summary: Delete a list content found by its slug
      description: As `deleteAdminListContent`.
      security: [{ managementKey: [] }]
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "409":
          description: "`in_use`: other contents refer to it through a reference field of the current schema, one inside a custom field or a repeater's rows included; the message names how many"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/{space}/lists/{model}/{id}/publish:
    post:
      operationId: publishAdminListContent
      tags: [lists]
      summary: Publish
      description: |
        Publishes `data` when given, else the current draft, else re-publishes the
        published data. Clears the draft and its key. `publishedAt` overrides the
        publish date; otherwise the first publish date is kept and `revisedAt` set
        to now. Fires `publish` webhooks.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/id"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishContent" }
      responses:
        "200":
          description: The published content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/api/{space}/lists/{model}/{id}/unpublish:
    post:
      operationId: unpublishAdminListContent
      tags: [lists]
      summary: Unpublish
      description: |
        Takes the content off the delivery API. Its data (the draft when there is
        one) is kept as a draft with a new draft key; `publishedAt` is cleared.
        Fires `unpublish` webhooks. A content that is not published is refused
        with 409 `not_published`, and a published one with 409 `in_use` while
        another content refers to it.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The content, now a draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "409":
          description: "`not_published`: the content is not published. `in_use`: other contents refer to it through a reference field of the current schema, one inside a custom field or a repeater's rows included; the message names how many"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/{space}/lists/{model}/{id}/discard-draft:
    post:
      operationId: discardAdminListContentDraft
      tags: [lists]
      summary: Discard the draft of a published list content
      description: Fires `discard` webhooks. A content with no draft is refused with 409.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The content, published only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_published`: the content has no published version to fall back to; delete it instead. `no_draft`: it is published with no draft to discard"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admin/api/{space}/lists/{model}/{id}/draft-key:
    post:
      operationId: getAdminListContentDraftKey
      tags: [lists]
      summary: The list content's draft key
      description: |
        For building preview URLs. Generated on first call; replaced whenever a
        draft is saved.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema:
                type: object
                required: [draftKey]
                properties:
                  draftKey: { type: string, examples: ["3f1c…"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/{space}/objects/{model}:
    parameters:
      - $ref: "#/components/parameters/space"
      - $ref: "#/components/parameters/model"
    get:
      operationId: getAdminObject
      tags: [objects]
      summary: Read an object, both versions
      description: 404 for a `list` model, or before the object's first write.
      security: [{ managementKey: [] }]
      responses:
        "200":
          description: The object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAdminObject
      tags: [objects]
      summary: Save a draft of an object
      description: |
        As saving a draft of a list content. The first save makes the object,
        filling the defaults; two first writes at once make one, and the other is
        refused with 409 `object_exists`. 404 for a `list` model.
      security: [{ managementKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDraft" }
      responses:
        "200":
          description: The content with its new draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`object_exists`: another first write made the object at the same time"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/api/{space}/objects/{model}/publish:
    post:
      operationId: publishAdminObject
      tags: [objects]
      summary: Publish an object
      description: |
        As publishing a list content. Before its first write, `data` makes the
        object, published; without `data` that is a 404; two first writes at
        once make one, and the other is refused with 409 `object_exists`. 404 for
        a `list` model.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishContent" }
      responses:
        "200":
          description: The published content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`object_exists`: another first write made the object at the same time"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/api/{space}/objects/{model}/unpublish:
    post:
      operationId: unpublishAdminObject
      tags: [objects]
      summary: Unpublish an object
      description: |
        As unpublishing a list content. 404 for a `list` model, or before the
        object's first write.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
      responses:
        "200":
          description: The content, now a draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "409":
          description: "`not_published`: the content is not published. `in_use`: other contents refer to it through a reference field of the current schema, one inside a custom field or a repeater's rows included; the message names how many"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/{space}/objects/{model}/discard-draft:
    post:
      operationId: discardAdminObjectDraft
      tags: [objects]
      summary: Discard the draft of an object
      description: |
        As discarding the draft of a list content. 404 for a `list` model, or
        before the object's first write.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
      responses:
        "200":
          description: The content, published only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_published`: the content has no published version to fall back to. `no_draft`: it is published with no draft to discard"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admin/api/{space}/objects/{model}/draft-key:
    post:
      operationId: getAdminObjectDraftKey
      tags: [objects]
      summary: The draft key of an object
      description: |
        As the draft key of a list content. 404 for a `list` model, or before the
        object's first write.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema:
                type: object
                required: [draftKey]
                properties:
                  draftKey: { type: string, examples: ["3f1c…"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/{space}/keys:
    parameters:
      - $ref: "#/components/parameters/space"
    get:
      operationId: listDeliveryKeys
      tags: [keys]
      summary: The space's delivery keys and webhook secret
      security: [{ managementKey: [] }]
      responses:
        "200":
          description: Keys (without their plaintext) and the secret sent as `X-KOYA-WEBHOOK-KEY`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryKeys" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createDeliveryKey
      tags: [keys]
      summary: Create a delivery key
      description: The plaintext `key` appears in this response only; the server stores its SHA-256.
      security: [{ managementKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, default: "" }
              additionalProperties: false
      responses:
        "201":
          description: The new key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedDeliveryKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /admin/api/{space}/keys/{id}:
    delete:
      operationId: deleteDeliveryKey
      tags: [keys]
      summary: Delete a delivery key
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/id"
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/{space}/media:
    parameters:
      - $ref: "#/components/parameters/space"
    get:
      operationId: listMedia
      tags: [media]
      summary: List media, newest first
      security: [{ managementKey: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Matches file names.
        - name: limit
          in: query
          schema: { type: integer, minimum: 0, default: 10 }
          description: Values above 100 are clamped to 100.
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 9223372036854775807, default: 0 }
      responses:
        "200":
          description: A page of media
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaList" }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload images
      description: |
        `multipart/form-data` with one or more `file` parts and an optional `alt`
        applied to all of them. PNG, JPEG, GIF and WebP, up to 20 MB each and 20 MB
        together, decided by the file's leading bytes; the part's Content-Type is
        ignored. The whole request body is limited to 21 MB. A JPEG, PNG or WebP
        is stored without its metadata but its orientation and colour profile.
      security: [{ managementKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  items: { type: string, format: binary }
                alt: { type: string }
      responses:
        "201":
          description: The stored media, in upload order
          content:
            application/json:
              schema:
                type: object
                required: [media]
                properties:
                  media:
                    type: array
                    items: { $ref: "#/components/schemas/Media" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: "`too_large`: images over 20 MB, alone or together, or a request body over 21 MB"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: "`empty_file` or `unsupported_type`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admin/api/{space}/media/{id}:
    parameters:
      - $ref: "#/components/parameters/space"
      - $ref: "#/components/parameters/id"
    get:
      operationId: getMedia
      tags: [media]
      summary: Read one media
      security: [{ managementKey: [] }]
      responses:
        "200":
          description: The media plus `references`, the number of contents that use it in a `media` or `richtext` field of the current schema, one inside a custom field or a repeater's rows included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaWithReferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateMedia
      tags: [media]
      summary: Set the alt text
      security: [{ managementKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alt]
              properties:
                alt: { type: string }
      responses:
        "200":
          description: The updated media
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Delete a media and its file
      description: Refused with 409 `in_use` while any content still uses the file (see `references`).
      security: [{ managementKey: [] }]
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "409":
          description: "`in_use`: the message names how many contents use the file"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    deliveryKey:
      # the scheme's type is OpenAPI's own word; the header keeps its name for
      # the sake of the clients already sending it
      type: apiKey
      in: header
      name: X-KOYA-DELIVERY-KEY
      description: A delivery key of the space being read (`koya_…`); one from another space is 403.
    managementKey:
      type: http
      scheme: bearer
      description: A management key (`koya_mgmt_…`) from the space's Keys page in the admin UI. It reaches that one space; another space's route is 403. Nothing else reaches the admin API, neither the owner secret nor the admin UI's session.

  parameters:
    space:
      name: space
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
    model:
      name: model
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
    id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
    slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 0, default: 10 }
      description: Values above 100 are clamped to 100.
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 9223372036854775807, default: 0 }
    orders:
      name: orders
      in: query
      schema: { type: string }
      description: |
        Comma-separated field or system field names, `-` prefix for descending,
        e.g. `-publishedAt,title`. Default: newest published first.
    filters:
      name: filters
      in: query
      schema: { type: string }
      description: |
        `field[op]value` terms joined with `[and]` and `[or]`; `[or]` separates
        groups of `[and]` terms. Operators: `equals`, `not_equals`, `contains`,
        `not_contains`, `begins_with`, `exists`, `not_exists`, `less_than`,
        `greater_than`. On a `many` field, `equals` and `contains` mean "has
        this value", and `not_equals` and `not_contains` "does not have this
        value". On a `richtext` field, `contains`, `not_contains` and
        `begins_with` read its text without tags. On a `custom` field only
        `contains` and `not_contains` work: `contains` matches when one of its
        text, textarea, slug or richtext fields contains the value,
        `not_contains` when none does; any other operator, or `orders` on it,
        is `bad_query`. One of those fields is named through its custom field,
        as `meta.title[contains]x`, and takes only `contains` and
        `not_contains`. A `repeater` field is the same as a custom field, over
        the fields of every row. Example:
        `title[contains]lisp[and]publishedAt[exists]`.
    q:
      name: q
      in: query
      schema: { type: string }
      description: |
        Search: the text of the model's `text`, `textarea`, `slug` and `richtext`
        fields, those inside a custom field or a repeater's rows included,
        contains it (rich text
        without its tags), or it is a content's whole id. Applies together with
        `filters`.
    fields:
      name: fields
      in: query
      schema: { type: string }
      description: |
        Comma-separated top-level fields to keep in each content; applied after
        `include` and media expansion. A custom field or a repeater is kept
        whole. The system
        fields are always kept.
    include:
      name: include
      in: query
      schema: { type: string }
      description: |
        Comma-separated reference fields to embed, dotted for nesting:
        `tags,author.team` embeds `tags`, `author`, and `team` inside each `author`.
        Only `reference` fields may be named; one inside a custom field is named
        through it, as `meta.author`, and a path ending at a custom field or at
        anything else inside it is `bad_query`. One in a repeater's rows is named
        through the repeater, as `blocks.by`, and embedded in each row whose
        custom field has a reference named `by`, the other rows left as they
        are; a path that reaches no reference is `bad_query`. What is embedded is the referenced
        contents' published data, even when the request carries a `draftKey`;
        an embedded content carries no draft key. Referenced contents that
        are missing or unpublished are dropped from a `many` field and `null` in a
        single one.
    draftKey:
      name: draftKey
      in: query
      schema: { type: string }
      description: The content's draft key (from the admin API or the editor's preview link) serves its draft instead of the published data. The contents it embeds through `include` stay published.

  responses:
    BadRequest:
      description: "`bad_request` or `bad_json`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    BadQuery:
      description: "`bad_query`: a malformed `filters`, an unknown field in `filters`/`orders`/`include`, an unknown operator, an operator or an order a custom field, a field inside one or a repeater does not take, a value that is not a number for a `number` field or not `true`/`false` for a `boolean` one, an `include` path with a segment that is not a reference (or, on the way to one, a custom field or a repeater), or a bad integer"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    InvalidSchema:
      description: "`invalid_schema` (the document breaks SCHEMA.md) or `bad_json`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: "`unauthorized`: missing or wrong delivery key or management key"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: "`forbidden`: the delivery or management key belongs to another space; a space that does not exist is another space too"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: "`not_found`: unknown model, content, media or endpoint"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    TooLarge:
      description: "`too_large`: the request body is over 21 MB"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationFailed:
      description: "`validation_failed`: `details` lists each problem (codes are in SCHEMA.md)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
          example:
            error:
              code: validation_failed
              message: Content is invalid
              details:
                - { field: title, code: required, message: is required }
                - { field: slug, code: unique, message: must be unique }
    Deleted:
      description: Deleted
      content:
        application/json:
          schema:
            type: object
            required: [deleted]
            properties:
              deleted: { type: boolean, const: true }

  schemas:
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 in UTC with milliseconds
      examples: ["2026-09-20T05:04:03.123Z"]

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [validation_failed] }
            message: { type: string }
            details:
              description: "`validation_failed` lists problems, `destructive_changes` and `contents_do_not_fit` changes"
              oneOf:
                - type: array
                  items: { $ref: "#/components/schemas/ValidationProblem" }
                - type: array
                  items: { $ref: "#/components/schemas/Change" }

    ValidationProblem:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, examples: [title, meta.title, "blocks[1].text"] }
        code:
          type: string
          description: See SCHEMA.md "Content values"
          examples: [required, unique, max_length, pattern, slug, integer, min, max, option, type, unknown_field, custom_field]
        message: { type: string }

    Me:
      type: object
      required: [space, version]
      properties:
        space: { type: string, description: "the space the management key is limited to" }
        version: { type: string, examples: ["0.19.0"] }

    Schema:
      type: object
      description: One space's schema document; SCHEMA.md is normative. The space is named by the URL, not by the document.
      required: [koyaSchema]
      properties:
        koyaSchema: { type: integer, const: 1 }
        webhooks:
          type: array
          description: Responses always carry it.
          items: { $ref: "#/components/schemas/Webhook" }
        models:
          type: array
          description: Responses always carry it.
          items: { $ref: "#/components/schemas/Model" }
        customFields:
          type: array
          description: Omitted from the output when empty.
          items: { $ref: "#/components/schemas/CustomField" }

    CustomField:
      type: object
      description: |
        A set of fields a model uses as one field of type `custom`, or as the
        rows of a `repeater`. Its fields are any type but `slug`, `custom` and
        `repeater`, none is `unique` or carries `was`, and none is named
        `fieldId`, which names a repeater row's custom field.
      required: [name, fields]
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        fields:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Field" }

    Model:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
        kind: { type: string, enum: [list, object] }
        previewUrl:
          type: string
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://."
          description: Template for the editor's preview link, starting with `http://` or `https://`; `{CONTENT_ID}`, `{CONTENT_SLUG}` (the draft's) and `{DRAFT_KEY}` are substituted. A template with `{CONTENT_SLUG}` needs a slug field, and no link is shown while the slug is blank.
        publicUrl:
          type: string
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://."
          description: Template for the editor's published page link, starting with `http://` or `https://`; `{CONTENT_ID}` and `{CONTENT_SLUG}` (the published one) are substituted. A template with `{CONTENT_SLUG}` needs a slug field, and no link is shown while the slug is blank.
        label:
          type: string
          description: |
            A text or slug field of this model, not one inside a custom
            field, whose value the admin UI
            shows for a content. Absent, a content is shown by its id.
        was:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
          description: |
            The name this model had. A deploy renames it and moves its
            contents instead of dropping them; the stored schema keeps the
            new name alone, so a GET never returns it. See SCHEMA.md.
        fields:
          type: array
          description: Responses always carry it.
          items: { $ref: "#/components/schemas/Field" }

    Field:
      description: |
        A field of a model. Each `type` takes its own options (SCHEMA.md
        "Field"); any other key is refused with `invalid_schema`. `was` names
        the field this one was renamed from — a deploy moves the key in every
        stored content — and is never returned by a GET.
      oneOf:
        - $ref: "#/components/schemas/TextField"
        - $ref: "#/components/schemas/TextareaField"
        - $ref: "#/components/schemas/RichtextField"
        - $ref: "#/components/schemas/NumberField"
        - $ref: "#/components/schemas/BooleanField"
        - $ref: "#/components/schemas/DateField"
        - $ref: "#/components/schemas/DatetimeField"
        - $ref: "#/components/schemas/SelectField"
        - $ref: "#/components/schemas/MediaField"
        - $ref: "#/components/schemas/ReferenceField"
        - $ref: "#/components/schemas/SlugField"
        - $ref: "#/components/schemas/CustomFieldField"
        - $ref: "#/components/schemas/RepeaterField"
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/TextField"
          textarea: "#/components/schemas/TextareaField"
          richtext: "#/components/schemas/RichtextField"
          number: "#/components/schemas/NumberField"
          boolean: "#/components/schemas/BooleanField"
          date: "#/components/schemas/DateField"
          datetime: "#/components/schemas/DatetimeField"
          select: "#/components/schemas/SelectField"
          media: "#/components/schemas/MediaField"
          reference: "#/components/schemas/ReferenceField"
          slug: "#/components/schemas/SlugField"
          custom: "#/components/schemas/CustomFieldField"
          repeater: "#/components/schemas/RepeaterField"

    FieldName:
      type: string
      pattern: "^[a-z][a-zA-Z0-9]*$"
      description: Not one of the system fields `id`, `createdAt`, `updatedAt`, `publishedAt`, `revisedAt`.

    FieldHelp:
      type: string
      minLength: 1
      description: Shown under the field's name in the editor, to say what the field expects.

    TextField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: text }
        was: { $ref: "#/components/schemas/FieldName" }
        help: { $ref: "#/components/schemas/FieldHelp" }
        required: { type: boolean }
        maxLength: { type: integer, minimum: 1 }
        pattern: { type: string, description: A cl-ppcre (Perl-style) regular expression }
        unique: { type: boolean }

    TextareaField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: textarea }
        was: { $ref: "#/components/schemas/FieldName" }
        help: { $ref: "#/components/schemas/FieldHelp" }
        required: { type: boolean }
        maxLength: { type: integer, minimum: 1 }

    RichtextField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: richtext }
        was: { $ref: "#/components/schemas/FieldName" }
        help: { $ref: "#/components/schemas/FieldHelp" }
        required: { type: boolean }

    NumberField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: number }
        was: { $ref: "#/components/schemas/FieldName" }
        help: { $ref: "#/components/schemas/FieldHelp" }
        required: { type: boolean }
        min: { type: number }
        max: { type: number }
        integer: { type: boolean }

    BooleanField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: boolean }
        was: { $ref: "#/components/schemas/FieldName" }
        help: { $ref: "#/components/schemas/FieldHelp" }
        required: { type: boolean }
        default: { type: boolean, description: "`true` sets the field on a new content whose data does not mention it" }

    DateField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: date }
        was: { $ref: "#/components/schemas/FieldName" }
        help: { $ref: "#/components/schemas/FieldHelp" }
        required: { type: boolean }

    DatetimeField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: datetime }
        was: { $ref: "#/components/schemas/FieldName" }
        help: { $ref: "#/components/schemas/FieldHelp" }
        required: { type: boolean }

    SelectField:
      type: object
      required: [name, type, options]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: select }
        was: { $ref: "#/components/schemas/FieldName" }
        help: { $ref: "#/components/schemas/FieldHelp" }
        required: { type: boolean }
        options:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: "^[^,]*$" }
        many: { type: boolean }

    MediaField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: media }
        was: { $ref: "#/components/schemas/FieldName" }
        help: { $ref: "#/components/schemas/FieldHelp" }
        required: { type: boolean }
        many: { type: boolean, description: "An array of media ids, kept in their order; delivered as media objects, a file that is gone dropping out" }

    ReferenceField:
      type: object
      required: [name, type, model]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: reference }
        was: { $ref: "#/components/schemas/FieldName" }
        help: { $ref: "#/components/schemas/FieldHelp" }
        required: { type: boolean }
        model: { type: string, description: A model of the same schema }
        many: { type: boolean }

    SlugField:
      type: object
      required: [name, type]
      additionalProperties: false
      description: |
        A second key of a list content, typed by the editor and unique within
        the model. A list model has one at most, an object model none.
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: slug }
        was: { $ref: "#/components/schemas/FieldName" }
        help: { $ref: "#/components/schemas/FieldHelp" }
        required: { type: boolean }
        pattern: { type: string }

    CustomFieldField:
      type: object
      required: [name, type, customField]
      additionalProperties: false
      description: Its value is an object of the custom field's fields' values.
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: custom }
        was: { $ref: "#/components/schemas/FieldName" }
        help: { $ref: "#/components/schemas/FieldHelp" }
        required: { type: boolean }
        customField: { $ref: "#/components/schemas/FieldName", description: "A custom field of the same schema" }

    RepeaterField:
      type: object
      required: [name, type, customFields]
      additionalProperties: false
      description: |
        Its value is an array of rows, each an object naming its custom field
        in `fieldId` beside that custom field's fields' values. Only in a
        model, not inside a custom field.
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: repeater }
        was: { $ref: "#/components/schemas/FieldName" }
        help: { $ref: "#/components/schemas/FieldHelp" }
        required: { type: boolean, description: "At least one row" }
        customFields:
          type: array
          minItems: 1
          uniqueItems: true
          description: Custom fields of the same schema a row may be.
          items: { $ref: "#/components/schemas/FieldName" }

    Webhook:
      type: object
      description: |
        Belongs to the space and fires for every model unless `only` narrows it.
        Sent every event; the payload's `event` says which. An `events` key from
        older schemas is ignored.
      required: [url]
      properties:
        label: { type: string, minLength: 1, description: "Unique within the schema. Defaults to `url`; responses always carry it" }
        url:
          type: string
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://."
          description: Starts with `http://` or `https://`. See SCHEMA.md for which addresses are sent to.
        only:
          description: The model name, or model names without repeats, this webhook is narrowed to; absent means every model.
          oneOf:
            - { type: string, pattern: "^[a-z][a-z0-9-]*$" }
            - type: array
              uniqueItems: true
              items: { type: string, pattern: "^[a-z][a-z0-9-]*$" }

    Change:
      type: object
      required: [op, path, destructive, description]
      properties:
        op:
          type: string
          enum: [change_webhooks, change_custom_fields, add_model, remove_model, rename_model, change_kind,
                 change_model_options, add_field, remove_field, rename_field,
                 change_field_type, change_field_options]
        path: { type: string, description: "`webhooks`, `customFields`, `model`, `model.field`, or `model.field.subfield` inside a custom field (`model.field[customField].subfield` in a repeater)", examples: ["blog.title", "page.blocks[heading].level"] }
        destructive: { type: boolean }
        description: { type: string, examples: ["+ blog.title (text)"] }
        misfits:
          description: Stored contents that do not fit a tightened option or a required field added; present only when there are some
          type: array
          items: { $ref: "#/components/schemas/Misfit" }

    Misfit:
      type: object
      required: [id, field, version, message]
      properties:
        id: { type: string }
        field: { type: string, description: "The field, `field.subfield` inside a custom field, or `field[index]` / `field[index].subfield` in a repeater's row", examples: ["title", "blocks[1].text"] }
        version: { type: string, enum: [published, draft] }
        message: { type: string, examples: ["must be at most 50 characters"] }

    Plan:
      type: object
      required: [changes, destructive]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/Change" }
        destructive: { type: boolean }

    DeployResult:
      type: object
      required: [applied, schema]
      properties:
        applied:
          type: array
          items: { $ref: "#/components/schemas/Change" }
        schema: { $ref: "#/components/schemas/Schema" }

    CreateContent:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ContentData" }
        publish: { type: [boolean, "null"], default: false, description: "`null` is as absent" }
        id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          description: Defaults to a fresh ULID. `new` is refused, as the admin UI's new-content form.
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        publishedAt: { $ref: "#/components/schemas/Timestamp" }
        revisedAt: { $ref: "#/components/schemas/Timestamp" }

    UpdateDraft:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ContentData" }

    PublishContent:
      type: object
      properties:
        data:
          description: "`null` is as absent"
          oneOf: [{ $ref: "#/components/schemas/ContentData" }, { type: "null" }]
        publishedAt: { $ref: "#/components/schemas/Timestamp" }

    ContentData:
      type: object
      description: |
        Field name to value, as SCHEMA.md "Content values" defines them. Ids for
        `media` and `reference` fields; arrays on `many` fields; an object of
        its fields' values on a `custom` field; an array of rows on a
        `repeater`, each an object naming its custom field in `fieldId` beside
        that custom field's fields' values.
      additionalProperties: true

    Content:
      type: object
      description: |
        Delivery shape: the data with the system fields merged in. `media` fields
        are expanded to Media objects (or `null` when the file is gone); `richtext`
        HTML has its `/media/` URLs made absolute; `reference` fields are ids
        unless embedded through `include`; the same goes for the fields inside
        a `custom` field and a `repeater`'s rows, which keep their `fieldId`. With `fields`, only the named data
        fields are present; the system fields always are.
      required: [id, createdAt, updatedAt, publishedAt, revisedAt]
      properties:
        id: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        publishedAt:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        revisedAt:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
      additionalProperties: true
      example:
        id: 01J8Q0Z5X2W3V4U5T6S7R8Q9P0
        title: Hello
        slug: hello
        cover:
          id: 01J8Q0Z5X2W3V4U5T6S7R8Q9P1
          url: https://cms.example.com/media/website/01J8Q0Z5X2W3V4U5T6S7R8Q9P1.png
          filename: cover.png
          mime: image/png
          size: 12345
          width: 1200
          height: 630
          alt: Cover
          createdAt: "2026-09-20T05:04:03.123Z"
        tags: [01J8Q0Z5X2W3V4U5T6S7R8Q9P2]
        createdAt: "2026-09-20T05:04:03.123Z"
        updatedAt: "2026-09-20T05:04:03.123Z"
        publishedAt: "2026-09-20T05:04:03.123Z"
        revisedAt: "2026-09-20T05:04:03.123Z"

    ContentList:
      type: object
      required: [contents, totalCount, offset, limit]
      properties:
        contents:
          type: array
          items: { $ref: "#/components/schemas/Content" }
        totalCount: { type: integer }
        offset: { type: integer }
        limit: { type: integer }

    AdminContent:
      type: object
      description: "Admin shape: status, both data versions as stored (ids, not expanded) and metadata."
      required: [id, status, published, draft, draftKey, createdAt, updatedAt, publishedAt, revisedAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [draft, published, published+draft] }
        published:
          oneOf: [{ $ref: "#/components/schemas/ContentData" }, { type: "null" }]
        draft:
          oneOf: [{ $ref: "#/components/schemas/ContentData" }, { type: "null" }]
        draftKey:
          oneOf: [{ type: string }, { type: "null" }]
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        publishedAt:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        revisedAt:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]

    AdminContentList:
      type: object
      required: [contents, totalCount, offset, limit]
      properties:
        contents:
          type: array
          items: { $ref: "#/components/schemas/AdminContent" }
        totalCount: { type: integer }
        offset: { type: integer }
        limit: { type: integer }

    DeliveryKey:
      type: object
      required: [id, label, createdAt]
      properties:
        id: { type: string }
        label: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    Media:
      type: object
      required: [id, url, filename, mime, size, width, height, alt, createdAt]
      properties:
        id: { type: string, description: ULID }
        url: { type: string, description: "Absolute: KOYA_BASE_URL + /media/{space}/{id}.{ext}" }
        filename: { type: string, description: The uploaded file's base name }
        mime: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp] }
        size: { type: integer, description: Bytes, as stored }
        width:
          oneOf: [{ type: integer }, { type: "null" }]
        height:
          oneOf: [{ type: integer }, { type: "null" }]
        alt: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    MediaWithReferences:
      allOf:
        - $ref: "#/components/schemas/Media"
        - type: object
          required: [references]
          properties:
            references: { type: integer, description: The number of contents that use it in a `media` or `richtext` field of the current schema, one inside a custom field or a repeater's rows included }

    DeliveryKeys:
      type: object
      required: [keys, webhookSecret]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/DeliveryKey" }
        webhookSecret: { type: string, description: "Sent as `X-KOYA-WEBHOOK-KEY` with every webhook" }

    CreatedDeliveryKey:
      type: object
      required: [id, label, key]
      properties:
        id: { type: string }
        label: { type: string }
        key: { type: string, examples: ["koya_5d41402abc4b2a76b9719d911017c592…"] }

    MediaList:
      type: object
      required: [media, totalCount, offset, limit]
      properties:
        media:
          type: array
          items: { $ref: "#/components/schemas/Media" }
        totalCount: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
