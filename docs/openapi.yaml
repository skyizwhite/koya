openapi: 3.1.0
info:
  title: koya
  version: 0.10.0
  summary: Delivery and admin APIs of a koya server
  description: |
    Two JSON APIs on one server.

    * The **delivery API** (`/api/v1`) reads published content with a per-space
      **delivery key**, created on the space's *Keys* page. It answers browsers
      on any origin: a preflight `OPTIONS` gets `204` with
      `Access-Control-Allow-Origin: *`, `Access-Control-Allow-Methods: GET`,
      `Access-Control-Allow-Headers: X-KOYA-DELIVERY-KEY` and
      `Access-Control-Max-Age: 86400`, and every answer carries
      `Access-Control-Allow-Origin: *`. The admin API answers no cross-origin
      request.
    * The **admin API** (`/admin/api`) manages the schema, contents, keys and media
      with a **management key** (made on the space's *Keys* page) as a Bearer
      token. A key belongs to one space: every route but `/admin/api/me` names a
      space, and a key sent to another space's route is refused with 403. The
      owner secret only logs into the admin UI. State-changing
      requests that carry an `Origin` or `Referer` naming another site are
      rejected with 403; requests without either header (non-browser clients) are
      accepted.

    Bodies use camelCase keys. Timestamps are ISO 8601 in UTC with milliseconds
    (`2026-09-20T05:04:03.123Z`). Every error is
    `{"error": {"code", "message", "details"?}}`; any route can also answer
    `500 internal_error`, and any request body over 21 MB `413 too_large`. The
    schema document is specified in SCHEMA.md, and API.md walks through both
    APIs. koya-ts-sdk (https://github.com/skyizwhite/koya-ts-sdk) wraps them.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: https://cms.example.com
        description: The server's KOYA_BASE_URL

tags:
  - name: server
    description: The caller and the server itself
  - name: delivery
    description: Published content, read with a delivery key
  - name: schema
    description: The stored schema and the diff against a new one
  - name: contents
    description: Contents including drafts
  - name: keys
    description: Delivery keys and the webhook secret
  - name: media
    description: The image library

security: []

paths:
  /api/v1/{space}/{model}:
    get:
      operationId: getContents
      tags: [delivery]
      summary: List published contents, or read an object model's content
      description: |
        For a `list` model, a page of published contents. For an `object` model,
        its single content (published, or its draft with the right `draftKey`);
        `limit`, `offset`, `orders` and `filters` are ignored then.
      security: [{ deliveryKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/orders"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/filters"
        - $ref: "#/components/parameters/include"
        - $ref: "#/components/parameters/draftKey"
      responses:
        "200":
          description: A page of contents, or the object model's content
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ContentList"
                  - $ref: "#/components/schemas/Content"
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/{space}/{model}/{id}:
    get:
      operationId: getContent
      tags: [delivery]
      summary: Read one published content
      security: [{ deliveryKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/include"
        - $ref: "#/components/parameters/draftKey"
      responses:
        "200":
          description: The content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Content" }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /health:
    get:
      operationId: getHealth
      tags: [server]
      summary: Liveness, touching the database
      responses:
        "200":
          description: The server and its database answer; the body is a small HTML page saying `ok`
          content:
            text/html:
              schema: { type: string }
        "500":
          description: The database does not answer

  /admin/api/me:
    get:
      operationId: getMe
      tags: [server]
      summary: Who am I
      security: [{ managementKey: [] }]
      responses:
        "200":
          description: Confirms the key and reports the server version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/schema/{space}:
    parameters:
      - $ref: "#/components/parameters/space"
    get:
      operationId: getSchema
      tags: [schema]
      summary: The space's stored schema
      security: [{ managementKey: [] }]
      responses:
        "200":
          description: The schema document (see SCHEMA.md); empty `models` before any deploy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schema" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: deploySchema
      tags: [schema]
      summary: Replace the space's schema
      description: |
        Validates the document, diffs it against the space's stored schema and,
        unless a destructive change is present without `force=true`, stores it.
        Existing content is never modified. The space must already exist — it is
        made in the admin UI — and a deploy to an unknown name is a 404.
      security: [{ managementKey: [] }]
      parameters:
        - name: force
          in: query
          schema: { type: string, enum: ["true"] }
          description: Apply destructive changes too.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Schema" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployResult" }
        "400": { $ref: "#/components/responses/InvalidSchema" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`destructive_changes`: destructive changes without `force=true`; `details` lists every change"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                error:
                  code: destructive_changes
                  message: Schema deploy contains destructive changes; retry with force=true
                  details:
                    - { op: remove_field, path: blog.summary, destructive: true, description: "! - blog.summary (text)" }

  /admin/api/schema/{space}/plan:
    parameters:
      - $ref: "#/components/parameters/space"
    post:
      operationId: planSchema
      tags: [schema]
      summary: The changes a PUT of this schema would apply
      security: [{ managementKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Schema" }
      responses:
        "200":
          description: The plan; nothing is stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/InvalidSchema" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/contents/{space}/{model}:
    parameters:
      - $ref: "#/components/parameters/space"
      - $ref: "#/components/parameters/model"
    get:
      operationId: listAdminContents
      tags: [contents]
      summary: List every content of a model, drafts included
      description: |
        Takes the delivery API's `limit`, `offset`, `orders` and `filters`.
        Filters and orders apply to the draft data when a content has one.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/orders"
        - $ref: "#/components/parameters/filters"
      responses:
        "200":
          description: A page of contents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentList" }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createAdminContent
      tags: [contents]
      summary: Create a content
      description: |
        Saved as a draft unless `publish` is true. `id` and the system timestamps
        may be supplied, for imports that keep another system's ids and dates;
        `publishedAt` and `revisedAt` are only stored when publishing. For an
        `object` model that already has its content, that content is updated
        (drafted, or published with `publish`) instead of a second one being made.
      security: [{ managementKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContent" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`: a content with this `id` already exists"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/api/contents/{space}/{model}/{id}:
    parameters:
      - $ref: "#/components/parameters/space"
      - $ref: "#/components/parameters/model"
      - $ref: "#/components/parameters/id"
    get:
      operationId: getAdminContent
      tags: [contents]
      summary: Read a content, both versions
      security: [{ managementKey: [] }]
      responses:
        "200":
          description: The content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAdminContentDraft
      tags: [contents]
      summary: Save a draft
      description: |
        `data` is merged onto the current draft (or, without one, the published
        data): keys present replace, a `null` value removes the key, keys absent
        stay. The result is validated whole. A new draft key is issued, so earlier
        preview links stop working. When the result is what the content holds
        already, nothing is written -- no draft, no revision, no webhook -- and
        the content comes back as it is; when it is the published data again,
        the draft is dropped, as `discard-draft` would.
      security: [{ managementKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDraft" }
      responses:
        "200":
          description: The content with its new draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteAdminContent
      tags: [contents]
      summary: Delete a content
      description: |
        Removes both versions. Fires `delete` webhooks when it was published.
        Refused with 409 `in_use` while another content refers to it.
      security: [{ managementKey: [] }]
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "409":
          description: "`in_use`: other contents refer to it through a reference field of the current schema; the message names how many"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/contents/{space}/{model}/{id}/publish:
    post:
      operationId: publishAdminContent
      tags: [contents]
      summary: Publish
      description: |
        Publishes `data` when given, else the current draft, else re-publishes the
        published data. Clears the draft and its key. `publishedAt` overrides the
        publish date; otherwise the first publish date is kept and `revisedAt` set
        to now. Fires `publish` webhooks.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/id"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishContent" }
      responses:
        "200":
          description: The published content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/api/contents/{space}/{model}/{id}/unpublish:
    post:
      operationId: unpublishAdminContent
      tags: [contents]
      summary: Unpublish
      description: |
        Takes the content off the delivery API. Its data (the draft when there is
        one) is kept as a draft with a new draft key; `publishedAt` is cleared.
        Fires `unpublish` webhooks. A published content is refused with 409
        `in_use` while another content refers to it.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The content, now a draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "409":
          description: "`in_use`: other contents refer to it through a reference field of the current schema; the message names how many"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/contents/{space}/{model}/{id}/discard-draft:
    post:
      operationId: discardAdminContentDraft
      tags: [contents]
      summary: Discard the draft of a published content
      description: No webhook fires; what is published does not change.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The content, published only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_published`: the content has no published version to fall back to; delete it instead"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admin/api/contents/{space}/{model}/{id}/draft-key:
    post:
      operationId: getAdminContentDraftKey
      tags: [contents]
      summary: The content's draft key
      description: |
        For building preview URLs. Generated on first call; replaced whenever a
        draft is saved.
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/model"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema:
                type: object
                required: [draftKey]
                properties:
                  draftKey: { type: string, examples: ["3f1c…"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/keys/{space}:
    parameters:
      - $ref: "#/components/parameters/space"
    get:
      operationId: listDeliveryKeys
      tags: [keys]
      summary: The space's delivery keys and webhook secret
      security: [{ managementKey: [] }]
      responses:
        "200":
          description: Keys (without their plaintext) and the secret sent as `X-KOYA-WEBHOOK-KEY`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryKeys" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createDeliveryKey
      tags: [keys]
      summary: Create a delivery key
      description: The plaintext `key` appears in this response only; the server stores its SHA-256.
      security: [{ managementKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, default: "" }
              additionalProperties: false
      responses:
        "201":
          description: The new key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedDeliveryKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/keys/{space}/{id}:
    delete:
      operationId: deleteDeliveryKey
      tags: [keys]
      summary: Delete a delivery key
      security: [{ managementKey: [] }]
      parameters:
        - $ref: "#/components/parameters/space"
        - $ref: "#/components/parameters/id"
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /admin/api/media/{space}:
    parameters:
      - $ref: "#/components/parameters/space"
    get:
      operationId: listMedia
      tags: [media]
      summary: List media, newest first
      security: [{ managementKey: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Matches file names.
        - name: limit
          in: query
          schema: { type: integer, minimum: 0, default: 10 }
          description: Values above 100 are clamped to 100.
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A page of media
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaList" }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload images
      description: |
        `multipart/form-data` with one or more `file` parts and an optional `alt`
        applied to all of them. PNG, JPEG, GIF and WebP, up to 20 MB each, decided
        by the file's leading bytes; the part's Content-Type is ignored. The whole
        request body is limited to 21 MB.
      security: [{ managementKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  items: { type: string, format: binary }
                alt: { type: string }
      responses:
        "201":
          description: The stored media, in upload order
          content:
            application/json:
              schema:
                type: object
                required: [media]
                properties:
                  media:
                    type: array
                    items: { $ref: "#/components/schemas/Media" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: "`too_large`: a file over 20 MB, or a request body over 21 MB"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: "`empty_file` or `unsupported_type`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admin/api/media/{space}/{id}:
    parameters:
      - $ref: "#/components/parameters/space"
      - $ref: "#/components/parameters/id"
    get:
      operationId: getMedia
      tags: [media]
      summary: Read one media
      security: [{ managementKey: [] }]
      responses:
        "200":
          description: The media plus `references`, the number of contents that use it in a `media` or `richtext` field of the current schema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaWithReferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateMedia
      tags: [media]
      summary: Set the alt text
      security: [{ managementKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alt]
              properties:
                alt: { type: string }
      responses:
        "200":
          description: The updated media
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Delete a media and its file
      description: Refused with 409 `in_use` while any content still uses the file (see `references`).
      security: [{ managementKey: [] }]
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "409":
          description: "`in_use`: the message names how many contents use the file"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    deliveryKey:
      # the scheme's type is OpenAPI's own word; the header keeps its name for
      # the sake of the clients already sending it
      type: apiKey
      in: header
      name: X-KOYA-DELIVERY-KEY
      description: A delivery key of the space being read (`koya_…`); one from another space is 403.
    managementKey:
      type: http
      scheme: bearer
      description: A management key (`koya_mgmt_…`) from the space's Keys page in the admin UI. It reaches that one space; another space's route is 403. The admin UI's session cookie works too and reaches every space; the owner secret does not work here at all.

  parameters:
    space:
      name: space
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
    model:
      name: model
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
    id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 0, default: 10 }
      description: Values above 100 are clamped to 100.
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    orders:
      name: orders
      in: query
      schema: { type: string }
      description: |
        Comma-separated field or system field names, `-` prefix for descending,
        e.g. `-publishedAt,title`. Default: newest published first.
    filters:
      name: filters
      in: query
      schema: { type: string }
      description: |
        `field[op]value` terms joined with `[and]` and `[or]`; `[or]` separates
        groups of `[and]` terms. Operators: `equals`, `not_equals`, `contains`,
        `not_contains`, `begins_with`, `exists`, `not_exists`, `less_than`,
        `greater_than`. On a `many` field, `equals` and `contains` mean "has
        this value". Example: `title[contains]lisp[and]publishedAt[exists]`.
    fields:
      name: fields
      in: query
      schema: { type: string }
      description: |
        Comma-separated keys to keep in each content; applied after `include` and
        media expansion. System fields not named are dropped too.
    include:
      name: include
      in: query
      schema: { type: string }
      description: |
        Comma-separated reference fields to embed, dotted for nesting:
        `tags,author.team` embeds `tags`, `author`, and `team` inside each `author`.
        Only `reference` fields may be named. Referenced contents that are
        missing or unpublished are dropped from a `many` field and `null` in a
        single one.
    draftKey:
      name: draftKey
      in: query
      schema: { type: string }
      description: The content's draft key (from the admin API or the editor's preview link) serves its draft instead of the published data.

  responses:
    BadRequest:
      description: "`bad_request` or `bad_json`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    BadQuery:
      description: "`bad_query`: a malformed `filters`, an unknown field in `filters`/`orders`/`include`, or a bad integer"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    InvalidSchema:
      description: "`invalid_schema` (the document breaks SCHEMA.md) or `bad_json`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: "`unauthorized`: missing or wrong delivery key or management key"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: "`forbidden`: the delivery or management key belongs to another space"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    CrossOrigin:
      description: "`forbidden`: a browser request from another origin"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: "`not_found`: unknown space, model, content, media or endpoint"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationFailed:
      description: "`validation_failed`: `details` lists each problem (codes are in SCHEMA.md)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
          example:
            error:
              code: validation_failed
              message: Content is invalid
              details:
                - { field: title, code: required, message: is required }
                - { field: slug, code: unique, message: must be unique }
    Deleted:
      description: Deleted
      content:
        application/json:
          schema:
            type: object
            required: [deleted]
            properties:
              deleted: { type: boolean, const: true }

  schemas:
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 in UTC with milliseconds
      examples: ["2026-09-20T05:04:03.123Z"]

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [validation_failed] }
            message: { type: string }
            details:
              description: "`validation_failed` lists problems, `destructive_changes` changes"
              oneOf:
                - type: array
                  items: { $ref: "#/components/schemas/ValidationProblem" }
                - type: array
                  items: { $ref: "#/components/schemas/Change" }

    ValidationProblem:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code:
          type: string
          description: See SCHEMA.md "Content values"
          examples: [required, unique, max_length, pattern, slug, integer, min, max, option, type, unknown_field]
        message: { type: string }

    Me:
      type: object
      required: [owner, management, space, version]
      properties:
        owner: { type: boolean, description: "true when called with the admin UI's session" }
        management: { type: boolean, description: "true when called with a management key" }
        space: { type: [string, "null"], description: "the space a management key is limited to; null for the owner" }
        version: { type: string, examples: ["0.10.0"] }

    Schema:
      type: object
      description: One space's schema document; SCHEMA.md is normative. The space is named by the URL, not by the document.
      required: [koyaSchema]
      properties:
        koyaSchema: { type: integer, const: 1 }
        webhooks:
          type: array
          items: { $ref: "#/components/schemas/Webhook" }
        models:
          type: array
          items: { $ref: "#/components/schemas/Model" }

    Model:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
        kind: { type: string, enum: [list, object] }
        previewUrl:
          type: string
          description: Template for the editor's preview link; `{CONTENT_ID}` and `{DRAFT_KEY}` are substituted.
        publicUrl:
          type: string
          description: Template for the editor's published page link; `{CONTENT_ID}` is substituted.
        label:
          type: string
          description: |
            A text or slug field of this model, whose value the admin UI
            shows for a content. Absent, a content is shown by its id.
        was:
          type: string
          description: |
            The name this model had. A deploy renames it and moves its
            contents instead of dropping them; the stored schema keeps the
            new name alone, so a GET never returns it. See SCHEMA.md.
        fields:
          type: array
          items: { $ref: "#/components/schemas/Field" }

    Field:
      description: |
        A field of a model. Each `type` takes its own options (SCHEMA.md
        "Field"); any other key is refused with `invalid_schema`. `was` names
        the field this one was renamed from — a deploy moves the key in every
        stored content — and is never returned by a GET.
      oneOf:
        - $ref: "#/components/schemas/TextField"
        - $ref: "#/components/schemas/TextareaField"
        - $ref: "#/components/schemas/RichtextField"
        - $ref: "#/components/schemas/NumberField"
        - $ref: "#/components/schemas/BooleanField"
        - $ref: "#/components/schemas/DateField"
        - $ref: "#/components/schemas/DatetimeField"
        - $ref: "#/components/schemas/SelectField"
        - $ref: "#/components/schemas/MediaField"
        - $ref: "#/components/schemas/ReferenceField"
        - $ref: "#/components/schemas/SlugField"
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/TextField"
          textarea: "#/components/schemas/TextareaField"
          richtext: "#/components/schemas/RichtextField"
          number: "#/components/schemas/NumberField"
          boolean: "#/components/schemas/BooleanField"
          date: "#/components/schemas/DateField"
          datetime: "#/components/schemas/DatetimeField"
          select: "#/components/schemas/SelectField"
          media: "#/components/schemas/MediaField"
          reference: "#/components/schemas/ReferenceField"
          slug: "#/components/schemas/SlugField"

    FieldName:
      type: string
      pattern: "^[a-z][a-zA-Z0-9]*$"
      description: Not one of the system fields `id`, `createdAt`, `updatedAt`, `publishedAt`, `revisedAt`.

    TextField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: text }
        was: { $ref: "#/components/schemas/FieldName" }
        required: { type: boolean }
        maxLength: { type: integer, minimum: 1 }
        pattern: { type: string, description: A cl-ppcre (Perl-style) regular expression }
        unique: { type: boolean }

    TextareaField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: textarea }
        was: { $ref: "#/components/schemas/FieldName" }
        required: { type: boolean }
        maxLength: { type: integer, minimum: 1 }

    RichtextField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: richtext }
        was: { $ref: "#/components/schemas/FieldName" }
        required: { type: boolean }

    NumberField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: number }
        was: { $ref: "#/components/schemas/FieldName" }
        required: { type: boolean }
        min: { type: number }
        max: { type: number }
        integer: { type: boolean }

    BooleanField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: boolean }
        was: { $ref: "#/components/schemas/FieldName" }
        required: { type: boolean }
        default: { type: boolean, description: "`true` sets the field on a new content whose data does not mention it" }

    DateField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: date }
        was: { $ref: "#/components/schemas/FieldName" }
        required: { type: boolean }

    DatetimeField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: datetime }
        was: { $ref: "#/components/schemas/FieldName" }
        required: { type: boolean }

    SelectField:
      type: object
      required: [name, type, options]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: select }
        was: { $ref: "#/components/schemas/FieldName" }
        required: { type: boolean }
        options:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        many: { type: boolean }

    MediaField:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: media }
        was: { $ref: "#/components/schemas/FieldName" }
        required: { type: boolean }

    ReferenceField:
      type: object
      required: [name, type, model]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: reference }
        was: { $ref: "#/components/schemas/FieldName" }
        required: { type: boolean }
        model: { type: string, description: A model of the same schema }
        many: { type: boolean }

    SlugField:
      type: object
      required: [name, type, from]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/FieldName" }
        type: { type: string, const: slug }
        was: { $ref: "#/components/schemas/FieldName" }
        required: { type: boolean }
        from: { type: string, description: "A text or textarea field of the same model, filled into a blank slug" }
        unique: { type: boolean }
        pattern: { type: string }

    Webhook:
      type: object
      description: |
        Belongs to the space and fires for every model unless `only` narrows it.
        Sent every event; the payload's `event` says which. An `events` key from
        older schemas is ignored.
      required: [url]
      properties:
        label: { type: string, description: "Defaults to `url`; always present on output" }
        url: { type: string }
        only:
          type: array
          description: Model names this webhook is narrowed to; absent means every model.
          items: { type: string }

    Change:
      type: object
      required: [op, path, destructive, description]
      properties:
        op:
          type: string
          enum: [change_webhooks, add_model, remove_model, rename_model, change_kind,
                 change_model_options, add_field, remove_field, rename_field,
                 change_field_type, change_field_options]
        path: { type: string, examples: ["blog.title"] }
        destructive: { type: boolean }
        description: { type: string, examples: ["+ blog.title (text)"] }

    Plan:
      type: object
      required: [changes, destructive]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/Change" }
        destructive: { type: boolean }

    DeployResult:
      type: object
      required: [applied, schema]
      properties:
        applied:
          type: array
          items: { $ref: "#/components/schemas/Change" }
        schema: { $ref: "#/components/schemas/Schema" }

    CreateContent:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ContentData" }
        publish: { type: boolean, default: false }
        id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          description: Defaults to a fresh ULID.
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        publishedAt: { $ref: "#/components/schemas/Timestamp" }
        revisedAt: { $ref: "#/components/schemas/Timestamp" }

    UpdateDraft:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ContentData" }

    PublishContent:
      type: object
      properties:
        data: { $ref: "#/components/schemas/ContentData" }
        publishedAt: { $ref: "#/components/schemas/Timestamp" }

    ContentData:
      type: object
      description: |
        Field name to value, as SCHEMA.md "Content values" defines them. Ids for
        `media` and `reference` fields; arrays on `many` fields.
      additionalProperties: true

    Content:
      type: object
      description: |
        Delivery shape: the data with the system fields merged in. `media` fields
        are expanded to Media objects (or `null` when the file is gone); `richtext`
        HTML has its `/media/` URLs made absolute; `reference` fields are ids
        unless embedded through `include`. With `fields`, only the named keys
        are present, system fields included.
      required: [id, createdAt, updatedAt, publishedAt, revisedAt]
      properties:
        id: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        publishedAt:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        revisedAt:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
      additionalProperties: true
      example:
        id: 01J8Q0Z5X2W3V4U5T6S7R8Q9P0
        title: Hello
        slug: hello
        cover:
          id: 01J8Q0Z5X2W3V4U5T6S7R8Q9P1
          url: https://cms.example.com/media/website/01J8Q0Z5X2W3V4U5T6S7R8Q9P1.png
          filename: cover.png
          mime: image/png
          size: 12345
          width: 1200
          height: 630
          alt: Cover
          createdAt: "2026-09-20T05:04:03.123Z"
        tags: [01J8Q0Z5X2W3V4U5T6S7R8Q9P2]
        createdAt: "2026-09-20T05:04:03.123Z"
        updatedAt: "2026-09-20T05:04:03.123Z"
        publishedAt: "2026-09-20T05:04:03.123Z"
        revisedAt: "2026-09-20T05:04:03.123Z"

    ContentList:
      type: object
      required: [contents, totalCount, offset, limit]
      properties:
        contents:
          type: array
          items: { $ref: "#/components/schemas/Content" }
        totalCount: { type: integer }
        offset: { type: integer }
        limit: { type: integer }

    AdminContent:
      type: object
      description: "Admin shape: status, both data versions as stored (ids, not expanded) and metadata."
      required: [id, status, published, draft, draftKey, createdAt, updatedAt, publishedAt, revisedAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [draft, published, published+draft] }
        published:
          oneOf: [{ $ref: "#/components/schemas/ContentData" }, { type: "null" }]
        draft:
          oneOf: [{ $ref: "#/components/schemas/ContentData" }, { type: "null" }]
        draftKey:
          oneOf: [{ type: string }, { type: "null" }]
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        publishedAt:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        revisedAt:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]

    AdminContentList:
      type: object
      required: [contents, totalCount, offset, limit]
      properties:
        contents:
          type: array
          items: { $ref: "#/components/schemas/AdminContent" }
        totalCount: { type: integer }
        offset: { type: integer }
        limit: { type: integer }

    DeliveryKey:
      type: object
      required: [id, label, createdAt]
      properties:
        id: { type: string }
        label: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    Media:
      type: object
      required: [id, url, filename, mime, size, width, height, alt, createdAt]
      properties:
        id: { type: string, description: ULID }
        url: { type: string, description: "Absolute: KOYA_BASE_URL + /media/{space}/{id}.{ext}" }
        filename: { type: string, description: The uploaded file's base name }
        mime: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp] }
        size: { type: integer, description: Bytes }
        width:
          oneOf: [{ type: integer }, { type: "null" }]
        height:
          oneOf: [{ type: integer }, { type: "null" }]
        alt: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    MediaWithReferences:
      allOf:
        - $ref: "#/components/schemas/Media"
        - type: object
          required: [references]
          properties:
            references: { type: integer, description: The number of contents that use it in a `media` or `richtext` field of the current schema }

    DeliveryKeys:
      type: object
      required: [keys, webhookSecret]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/DeliveryKey" }
        webhookSecret: { type: string, description: "Sent as `X-KOYA-WEBHOOK-KEY` with every webhook" }

    CreatedDeliveryKey:
      type: object
      required: [id, label, key]
      properties:
        id: { type: string }
        label: { type: string }
        key: { type: string, examples: ["koya_5d41402abc4b2a76b9719d911017c592…"] }

    MediaList:
      type: object
      required: [media, totalCount, offset, limit]
      properties:
        media:
          type: array
          items: { $ref: "#/components/schemas/Media" }
        totalCount: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
